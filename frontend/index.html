<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover maximum-scale=1.0, user-scalable=no"
		/>
		<title>Depot OAK</title>

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Depot OAK" />
		<meta name="apple-mobile-web-app-status-bar-style" content="white" />
		<meta name="theme-color" content="#ffffff" />

		<!--
			Theme, stamped BEFORE the first pixel.

			The boot splash below is inline-styled precisely so it paints on the frame the HTML
			lands, which means it paints before any bundle runs — so if the theme were applied by
			the app, a dark-mode operator would get a white flash on every cold start, which is
			exactly the moment a phone is being held up to a face in a dark yard.

			Deliberately duplicated from utils/theme.js (same key, same resolution of "system")
			rather than imported: an import is a network round-trip, and this has to be neither
			async nor deferred. Keep the two in step.
		-->
		<script>
			try {
				var m = localStorage.getItem("oak-theme")
				var dark = m === "dark" || (m !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
				document.documentElement.dataset.theme = dark ? "dark" : "light"
				if (dark) document.querySelector('meta[name="theme-color"]').content = "#17191d"
			} catch (e) {}
		</script>

		<!-- PWA: static manifest (see public/manifest.json) -->
		<link rel="manifest" href="/assets/container_depot/ess/manifest.json" />
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"
			href="/assets/container_depot/ess/icons/icon-192.png"
		/>
		<link
			rel="apple-touch-icon"
			href="/assets/container_depot/ess/icons/icon-192.png"
		/>

		<!--
			Boot splash, styled INLINE on purpose.

			Everything else in the app is Tailwind, but Tailwind arrives as a stylesheet the
			browser must fetch and parse — and this markup has to paint before that, on the
			frame the HTML lands. A splash that waits for the CSS is a splash that shows up
			after the thing it was covering for.

			It covers a real gap: Vue does not mount until `router.isReady()` resolves, and the
			first route through a menu-gated path also awaits `fetchMenu()`. On a depot handset
			over 3G that is several seconds — and it used to be several seconds of blank grey,
			which reads as "the app is broken", not "the app is starting".

			Replaced automatically: Vue clears #app when it mounts over it. No teardown code,
			nothing to keep in step.
		-->
		<style>
			#oak-splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 18px;
				background: #f9fafb;
				font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			#oak-splash img {
				width: 68px;
				height: 68px;
			}
			#oak-splash .oak-splash-word {
				font-size: 19px;
				font-weight: 800;
				letter-spacing: -0.02em;
				color: #111827;
			}
			#oak-splash .oak-splash-word span {
				color: #ea6614;
			}
			/* The splash is the one screen that cannot use the Tailwind tokens (it paints
			   before the stylesheet), so it carries its own two-line dark variant. Values
			   mirror --c-gray-50 / --c-gray-900 / --c-brand-100 in main.css. */
			[data-theme="dark"] #oak-splash {
				background: #0f1115;
			}
			[data-theme="dark"] #oak-splash .oak-splash-word {
				color: #f5f6f8;
			}
			[data-theme="dark"] #oak-splash .oak-splash-bar {
				background: #3c1c0b;
			}
			/* An indeterminate bar, not a percentage: we genuinely do not know how long the
			   bundle and the menu call will take, and a fake percentage that stalls at 90%
			   is worse than no number at all. */
			#oak-splash .oak-splash-bar {
				position: relative;
				width: 132px;
				height: 3px;
				overflow: hidden;
				border-radius: 999px;
				background: #ffe7d4;
			}
			#oak-splash .oak-splash-bar::after {
				content: "";
				position: absolute;
				top: 0;
				bottom: 0;
				width: 42%;
				border-radius: 999px;
				background: #f97828;
				animation: oak-splash-slide 1.1s ease-in-out infinite;
			}
			@keyframes oak-splash-slide {
				0% { left: -42%; }
				100% { left: 100%; }
			}
			/* Respect the OS setting: the bar is decoration, and motion sickness is real. */
			@media (prefers-reduced-motion: reduce) {
				#oak-splash .oak-splash-bar::after {
					animation: none;
					left: 0;
					width: 100%;
					opacity: 0.55;
				}
			}
		</style>
	</head>
	<body class="antialiased bg-gray-50">
		<div id="app">
			<div id="oak-splash">
				<img src="/assets/container_depot/ess/icons/icon-192.png" alt="" />
				<p class="oak-splash-word">Depot <span>OAK</span></p>
				<div class="oak-splash-bar"></div>
			</div>
		</div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<!-- Frappe injects these when www/depot.html is rendered server-side.
		     In `vite dev` they stay as literals and main.js falls back to a
		     dev boot fetch. -->
		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = "{{ site_name }}"
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot }}
		</script>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
