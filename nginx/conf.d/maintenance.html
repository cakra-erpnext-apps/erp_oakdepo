<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0e0e">
<title>Sedang Diperbarui — Depot OAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<!--
  Dilayani nginx saat update (berkas maintenance.on ada) atau saat backend mati (502) —
  lihat default.conf. Semua aset inline: selama update, /assets/ sedang dibangun ulang.
  Jam mulai/selesai dibaca dari /__maintenance (isi maintenance.on, ditulis
  scripts/*-update.sh); tanpa berkas itu (502 biasa) barisnya disembunyikan.
-->
<style>
	:root {
		--bg: #0e0e0e; --card: #19191b; --line: #2a2a2d; --cell: #121214;
		--ink: #f5f5f4; --muted: #a1a1aa; --brand: #f97828;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; min-height: 100%; }
	body {
		min-height: 100vh; display: flex; flex-direction: column;
		background: var(--bg); color: var(--ink);
		font: 16px/1.55 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	header, footer { padding: 32px 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
	.brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
	.brand img { width: 44px; height: 44px; }
	.brand span, .accent { color: var(--brand); }
	main { flex: 1; display: grid; place-items: center; padding: 16px; }
	.card {
		width: 100%; max-width: 640px; background: var(--card); border: 1px solid var(--line);
		border-radius: 24px; padding: 48px 48px 40px; text-align: center;
	}
	.ring { position: relative; width: 88px; height: 88px; margin: 0 auto 28px; display: grid; place-items: center; color: var(--brand); }
	.ring::before {
		content: ""; position: absolute; inset: 0; border-radius: 50%;
		border: 2px solid rgb(249 120 40 / .18); border-left-color: var(--brand);
		animation: spin 1.4s linear infinite;
	}
	@keyframes spin { to { transform: rotate(360deg); } }
	h1 { font-size: 34px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 12px; }
	.lead { color: var(--muted); font-size: 18px; margin: 0 auto; max-width: 540px; }
	.times {
		display: grid; grid-template-columns: 1fr 1fr; margin-top: 32px; text-align: left;
		background: var(--cell); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
	}
	.times > div { padding: 18px 22px; }
	.times > div + div { border-left: 1px solid var(--line); }
	.times small { display: block; color: var(--muted); font-size: 14px; }
	.times b { font-size: 18px; font-weight: 600; }
	.bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 28px; overflow: hidden; }
	.bar i { display: block; height: 100%; width: 0; margin-left: auto; background: var(--brand); border-radius: 4px; transition: width 1s linear; }
	.foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; text-align: left; }
	.foot p { margin: 0; color: var(--muted); font-size: 15px; }
	.foot p b { color: var(--ink); }
	button {
		font: inherit; font-weight: 500; font-size: 17px; color: var(--ink); background: transparent;
		border: 1px solid var(--line); border-radius: 12px; padding: 12px 24px; cursor: pointer; white-space: nowrap;
	}
	button:hover { border-color: var(--muted); }
	button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
	footer { color: var(--muted); font-size: 15px; }
	footer a { color: var(--brand); }
	[hidden] { display: none !important; }
	@media (max-width: 600px) {
		header, footer { padding: 20px 16px; }
		footer { flex-direction: column; align-items: flex-start; }
		.card { padding: 32px 20px 24px; border-radius: 20px; }
		h1 { font-size: 26px; }
		.lead { font-size: 16px; }
		.times { grid-template-columns: 1fr; }
		.times > div + div { border-left: 0; border-top: 1px solid var(--line); }
		.foot { flex-direction: column; align-items: stretch; text-align: center; }
	}
	@media (prefers-reduced-motion: reduce) { .ring::before { animation: none; } .bar i { transition: none; } }
</style>
</head>

<main>
	<section class="card">
		<div class="ring" aria-hidden="true">
			<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
		</div>
		<h1>Depot OAK sedang diperbarui</h1>
		<p class="lead">Kami sedang memasang pembaruan sistem. Data yang sudah tersimpan aman — Anda bisa lanjut bekerja begitu halaman ini terbuka kembali.</p>
		<div class="times" id="times" hidden>
			<div><small>Mulai</small><b id="t-start"></b></div>
			<div><small>Perkiraan selesai</small><b class="accent" id="t-end"></b></div>
		</div>
		<div class="bar"><i id="bar"></i></div>
		<div class="foot">
			<p role="status">Mengecek ulang otomatis dalam <b id="left">20 detik</b></p>
			<button type="button" id="now">Cek sekarang</button>
		</div>
	</section>
</main>
<footer>
	<!-- Isi kontak IT dan nama perusahaan di sini; baris yang kosong tidak tampil. -->
	<span id="help" data-contact="" data-href="">Butuh bantuan mendesak? Hubungi IT di <a id="help-link"></a></span>
	<span id="company"></span>
</footer>
<script>
	const PERIOD = 20
	const $ = (id) => document.getElementById(id)

	const help = $("help")
	if (help.dataset.contact) {
		$("help-link").textContent = help.dataset.contact
		$("help-link").href = help.dataset.href || "#"
	} else help.hidden = true

	const wib = (ms) =>
		new Intl.DateTimeFormat("id-ID", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit" }).format(ms) + " WIB"

	// maintenance.on: "start=<epoch detik>" dan "minutes=<perkiraan>", satu per baris.
	fetch("/__maintenance", { cache: "no-store" })
		.then((r) => (r.ok ? r.text() : ""))
		.then((txt) => {
			const kv = Object.fromEntries(txt.split("\n").map((l) => l.split("=")).filter((p) => p.length === 2))
			const start = Number(kv.start) * 1000
			if (!start) return
			const end = start + (Number(kv.minutes) || 15) * 60000
			$("t-start").textContent = wib(start)
			$("t-end").textContent = Date.now() > end ? "Sebentar lagi" : wib(end)
			$("times").hidden = false
		})
		.catch(() => {})

	let left = PERIOD
	const tick = () => {
		$("left").textContent = `${left} detik`
		$("bar").style.width = `${(left / PERIOD) * 100}%`
		if (left-- <= 0) location.reload()
	}
	tick()
	setInterval(tick, 1000)
	$("now").onclick = () => location.reload()
</script>
