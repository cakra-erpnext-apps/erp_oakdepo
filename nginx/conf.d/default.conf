map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TWA (APK "Depot OAK") — Digital Asset Links.
# Frappe menolak setiap /.well-known/ yang bukan OAuth (frappe/app.py), jadi berkas
# ini harus dilayani nginx, bukan app. Tanpa berkas ini Chrome menolak verifikasi
# dan APK tampil dengan address bar di atas layar.
# Ganti 68:B1:A5:64:8A:0F:36:05:FC:EF:79:9A:20:86:27:A4:07:8F:92:AC:34:E2:89:1E:2F:26:DB:06:03:8E:EC:A9 dengan fingerprint SHA-256 signing key APK
# (ada di output PWABuilder / `keytool -list -v -keystore ...`), lalu restart nginx.
# Host selain app.oakdepo.com sengaja 404: hanya domain depot yang punya app Android.
map $host $twa_assetlinks {
    default "";
    app.oakdepo.com '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.oakdepo.app.twa","sha256_cert_fingerprints":["68:B1:A5:64:8A:0F:36:05:FC:EF:79:9A:20:86:27:A4:07:8F:92:AC:34:E2:89:1E:2F:26:DB:06:03:8E:EC:A9"]}}]';
}

# Cache untuk /assets/.
# Hanya berkas di dist/ yang namanya membawa hash isi (nama berubah tiap kali isinya
# berubah); cuma itu yang boleh immutable. Berkas bernama tetap (public/js/*.js,
# public/css/*.css) tidak boleh: immutable 1 tahun berarti browser yang pernah
# membuka halaman TIDAK PERNAH menanyakannya lagi, jadi perbaikan skrip tidak
# sampai ke pemakai lama — itu yang membuat "Remember me" di /login mati di
# perangkat lama (yang jalan versi skrip sebelum kotaknya pindah ke HTML).
# no-cache tetap boleh disimpan browser, hanya wajib revalidasi: ETag balas 304.
map $uri $asset_cache_control {
    default                 "no-cache";
    "~^/assets/[^/]+/dist/" "public, immutable, max-age=31536000";
}

upstream frappe_backend {
    server backend:8000 fail_timeout=0;
}
upstream frappe_socketio {
    server websocket:9000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Service worker PWA — HARUS di atas `location /assets/`.
    # Dua hal yang diperbaiki di sini:
    #  1. `Service-Worker-Allowed`. Skripnya dilayani dari /assets/, jadi scope bawaannya
    #     /assets/container_depot/ess/ dan tidak mencakup /depot. Akibatnya
    #     `navigator.serviceWorker.ready` di /depot menggantung selamanya, dan tombol
    #     aktifkan notifikasi macet di "memproses" tanpa pernah gagal.
    #  2. Cache. Aturan /assets/ memberi 1 tahun immutable; itu salah untuk service worker,
    #     yang harus dicek ulang tiap kali app dibuka.
    location = /assets/container_depot/ess/service-worker.js {
        alias /home/frappe/frappe-bench/sites/assets/container_depot/ess/service-worker.js;
        add_header Service-Worker-Allowed "/depot";
        add_header Cache-Control "no-cache";
    }

    # --- PERTAHANKAN alias asli — JANGAN pakai root ---
    location /assets/ {
        alias /home/frappe/frappe-bench/sites/assets/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control $asset_cache_control;
    }

    # Berkas publik (/files) HARUS dilayani nginx.
    # Frappe hanya melayani /private/files (frappe/app.py) dan berkas statis dari
    # folder www setiap app — sites/<site>/public/files tidak ada di jalur itu, jadi
    # tanpa blok ini setiap unduhan berkas publik balas 404 dari Frappe.
    location /files/ {
        alias /home/frappe/frappe-bench/sites/$host/public/files/;
        try_files $uri =404;
    }

    location /socket.io/ {
        proxy_pass http://frappe_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_read_timeout 120s;
    }

    # Halaman maintenance, dipakai dua jalur:
    #  1. Saat update. scripts/*-update.sh membuat berkas `maintenance.on` di folder ini
    #     (bind mount, jadi langsung terlihat tanpa reload) dan menghapusnya di akhir.
    #  2. Backend mati di luar update (502) — pemakai tetap dapat halaman yang bisa dibaca,
    #     bukan halaman error nginx. 504 sengaja tidak: itu request lambat, bukan server mati.
    # 503 + Retry-After, jadi PWA membacanya sebagai "server tidak terjangkau" dan menampilkan
    # data cache-nya (frontend/src/data/cache.js looksOffline).
    location @maintenance {
        root /etc/nginx/conf.d;
        try_files /maintenance.html =503;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    # Jam mulai + perkiraan durasi untuk halaman maintenance (isi maintenance.on).
    # 404 di luar update — halaman lalu menyembunyikan baris jamnya.
    location = /__maintenance {
        alias /etc/nginx/conf.d/maintenance.on;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location = /.well-known/assetlinks.json {
        if ($twa_assetlinks = "") {
            return 404;
        }
        default_type application/json;
        return 200 $twa_assetlinks;
    }

    location / {
        error_page 502 503 @maintenance;
        if (-f /etc/nginx/conf.d/maintenance.on) {
            return 503;
        }
        proxy_pass http://frappe_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
